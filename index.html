<!DOCTYPE html>
<html lang="ja">
<head>

<title>内灘町の公衆トイレマップ</title>
<link 
  rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
/>
<style>
  #map { height: 100vh; width: 100%; }
</style>
</head>

const map = L.map('map').setView([36.657, 136.648], 13);

// OpenStreetMapのタイルレイヤーを設定

}).addTo(map);

// カスタムアイコンを作成（トイレアイコンの例）
const toiletIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/892/892458.png',
  iconSize: [30, 30],
  iconAnchor: [15, 30],
  popupAnchor: [0, -30]
});

// トイレごとにマーカーを設置しポップアップ連携
toilets.forEach(toilet => {
  const marker = L.marker([toilet.lat, toilet.lon], { icon: toiletIcon }).addTo(map);
  const popupContent = `<strong>${toilet.name}</strong><br>${toilet.address}<br>${toilet.info}`;
  marker.bindPopup(popupContent);
});
</script>
