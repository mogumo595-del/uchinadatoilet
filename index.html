<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内灘町の公衆トイレマップ</title>
<link 
  rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
/>
<style>
  #map { height: 100vh; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script 
  src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
></script>
<script>
// 地図の初期設定（ご指定の位置とズームレベル）
const map = L.map('map').setView([36.657, 136.648], 13);

// OpenStreetMapのタイルレイヤーを設定
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

// トイレデータ（CSVの緯度経度・名称・住所・利用時間など抜粋）
const toilets = [
  {
    name: "向粟崎都市緑地",
    address: "石川県河北郡内灘町字向粟崎4丁目163番地1",
    lat: 36.63076,
    lon: 136.62907,
    info: "設置位置: 東側駐車場横<br>利用時間: 24時間利用可"
  },
  {
    name: "はまちどり公園",
    address: "石川県河北郡内灘町字千鳥台4丁目142番地",
    lat: 36.638697,
    lon: 136.625597,
    info: "設置位置: 西側入口横<br>利用時間: 24時間利用可"
  },
  {
    name: "鶴ケ丘中央公園",
    address: "石川県河北郡内灘町字鶴ケ丘5丁目1番地44",
    lat: 36.645422,
    lon: 136.639569,
    info: "設置位置: 東側入口横<br>利用時間: 24時間利用可"
  },
  // 以下、同様に全件を入れてください
];

// カスタムアイコンを作成（トイレアイコンの例）
const toiletIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/892/892458.png',
  iconSize: [30, 30],
  iconAnchor: [15, 30],
  popupAnchor: [0, -30]
});

// トイレごとにマーカーを設置しポップアップ連携
toilets.forEach(toilet => {
  const marker = L.marker([toilet.lat, toilet.lon], { icon: toiletIcon }).addTo(map);
  const popupContent = `<strong>${toilet.name}</strong><br>${toilet.address}<br>${toilet.info}`;
  marker.bindPopup(popupContent);
});
</script>

</body>
</html>
